# Lanruj ca Flatpak.
#
# Construire și instalare locală (din dosarul flatpak/):
#   flatpak-builder --user --install --force-clean build-dir io.github.ThinkRoot99.Lanruj.yml
# Pachetul de dat mai departe (un singur fișier .flatpak):
#   flatpak-builder --repo=repo --force-clean build-dir io.github.ThinkRoot99.Lanruj.yml
#   flatpak build-bundle repo lanruj.flatpak io.github.ThinkRoot99.Lanruj
# După o schimbare în Cargo.lock: python3 flatpak/genereaza-surse.py > flatpak/cargo-sources.json
id: io.github.ThinkRoot99.Lanruj
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lanruj

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # jurnalul (Markdown) și copiile de siguranță implicite; restul fișierelor trec prin portalul de fișiere
  - --filesystem=~/.lanruj:create
  - --filesystem=xdg-documents/Lanruj - copii:create
  # iconița din systray (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # blocarea odată cu ecranul
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.freedesktop.ScreenSaver

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lanruj/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: lanruj
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/lanruj -t /app/bin
      - install -Dm644 data/io.github.ThinkRoot99.Lanruj.desktop -t /app/share/applications
      - install -Dm644 data/io.github.ThinkRoot99.Lanruj.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.ThinkRoot99.Lanruj.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.ThinkRoot99.Lanruj-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/lanruj-idee-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - flatpak/build-dir
          - flatpak/repo
          - flatpak/.flatpak-builder
          - flatpak/lanruj.flatpak
      - cargo-sources.json
