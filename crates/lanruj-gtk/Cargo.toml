[package]
name = "lanruj"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
lanruj-core = { version = "0.1.0", path = "../lanruj-core" }
